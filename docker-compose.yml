services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marcaja
      POSTGRES_PASSWORD: marcaja
      POSTGRES_DB: marcaja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcaja -d marcaja"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Evolution API no Hetzner (não no mesmo VPS pequeno que a BD).
  # Descomente só para testes locais com RAM >= 4 GB.
  # evolution:
  #   image: atendai/evolution-api:v2.2.3
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     AUTHENTICATION_API_KEY: change-me
  #     DATABASE_ENABLED: "false"
  #   volumes:
  #     - evolution_data:/evolution/store

volumes:
  postgres_data:
